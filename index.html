<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Santos Family Health</title>
<meta name="description" content="A private family medical ledger — consultations, labs, prescriptions, emergencies, vitals and appointments — with email sign-in.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C6B'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:wght@500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#FBFAF6; --ink:#1C2422; --muted:#5E685F;
  --faint:#8A938C; --line:#E4E1D7; --line-strong:#D1CDBF;
  --primary:#0E7C6B; --primary-ink:#0A5B4F; --primary-soft:#DCEBE6;
  --ok:#3A7D44; --warn:#966011; --crit:#B23B3B; --info:#3B6EA5;
  --t-appt:#3B6EA5; --t-consult:#0E7C6B; --t-lab:#7B5EA8; --t-rx:#3A7D44;
  --t-er:#B23B3B; --t-vitals:#966011; --t-vax:#2C8299; --t-note:#79837B; --t-admit:#9A5528;
  --shadow:0 1px 2px rgba(28,36,34,.05), 0 10px 28px -14px rgba(28,36,34,.18);
  --radius:11px;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"Spectral","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1A201D; --surface-2:#151A18; --ink:#E7ECE9; --muted:#9DA8A1;
    --faint:#70807A; --line:#2A322E; --line-strong:#3A433E;
    --primary:#3FB3A1; --primary-ink:#8FD8CD; --primary-soft:#173430;
    --ok:#5FB56B; --warn:#D69A46; --crit:#E0736F; --info:#6FA0D0;
    --t-appt:#6FA0D0; --t-consult:#3FB3A1; --t-lab:#A98FD6; --t-rx:#5FB56B;
    --t-er:#E0736F; --t-vitals:#D69A46; --t-vax:#5FB0C6; --t-note:#8A938D; --t-admit:#CE8A5C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A201D; --surface-2:#151A18; --ink:#E7ECE9; --muted:#9DA8A1;
  --faint:#70807A; --line:#2A322E; --line-strong:#3A433E;
  --primary:#3FB3A1; --primary-ink:#8FD8CD; --primary-soft:#173430;
  --ok:#5FB56B; --warn:#D69A46; --crit:#E0736F; --info:#6FA0D0;
  --t-appt:#6FA0D0; --t-consult:#3FB3A1; --t-lab:#A98FD6; --t-rx:#5FB56B;
  --t-er:#E0736F; --t-vitals:#D69A46; --t-vax:#5FB0C6; --t-note:#8A938D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-ink)}
::selection{background:var(--primary-soft)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:11px clamp(14px,3vw,26px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:17px;font-weight:600}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.whoami{font-size:12px;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary-ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.icon-btn:hover{border-color:var(--primary)}

.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 57px)}
.rail{border-right:1px solid var(--line);background:var(--surface-2);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.rail h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-family:var(--sans);font-weight:700;margin:2px 6px 4px}
.person-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:8px 9px;border-radius:9px}
.person-btn:hover{background:var(--surface);border-color:var(--line)}
.person-btn[aria-current="true"]{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;font-family:var(--mono)}
.person-btn .pn{font-weight:600;font-size:13.5px;line-height:1.2}
.person-btn .pr{font-size:11.5px;color:var(--muted)}
.person-btn .pdot{margin-left:auto;flex:none;width:7px;height:7px;border-radius:50%;background:var(--t-appt)}
.rail-foot{margin-top:auto;padding:10px 6px 0;font-size:11px;color:var(--faint);border-top:1px solid var(--line);line-height:1.45}

.main{padding:22px clamp(14px,4vw,40px) 60px;max-width:1000px;margin:0 auto;width:100%}
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phead .avatar{width:52px;height:52px;font-size:18px}
.phead h1{font-size:25px}
.phead-sub{color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.phead-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);color:var(--muted)}
.chip.cond{border-color:color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary-ink);background:var(--primary-soft)}
.chip.alg{border-color:color-mix(in srgb,var(--crit) 45%,transparent);color:var(--crit)}
.careteam{font-size:12.5px;color:var(--muted);margin-top:10px}
.careteam b{color:var(--ink);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);min-height:92px;display:flex;flex-direction:column;gap:3px}
.tile.tap{cursor:pointer}.tile.tap:hover{border-color:var(--primary)}
.tile .tl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.tile .tv{font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .tsub{font-size:11.5px;color:var(--muted)}
.tile .spark{color:var(--t-vitals);margin-top:auto}
.tile .flagdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-left:5px}

.attention{margin:18px 0;border:1px solid color-mix(in srgb,var(--warn) 38%,transparent);border-radius:var(--radius);overflow:hidden}
.attention h3{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);font-weight:700;
  padding:9px 13px;background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.attention ul{list-style:none;margin:0;padding:4px 0}
.attention li{padding:7px 13px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.attention li .ad{color:var(--muted);font-size:12px}

.sec-head{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.sec-head h2{font-size:17px}
.sec-head .btn{margin-left:auto}

.appt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.appt-card{border:1px solid var(--line);border-left:3px solid var(--t-appt);border-radius:9px;background:var(--surface);padding:11px 13px;cursor:pointer}
.appt-card:hover{border-color:var(--primary);border-left-color:var(--t-appt)}
.appt-card .aw{font-size:11px;font-family:var(--mono);color:var(--t-appt);font-weight:600}
.appt-card .at{font-weight:600;font-size:13.5px;margin:2px 0}
.appt-card .as{font-size:12px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.filters button{border:1px solid var(--line-strong);background:var(--surface);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button .c{opacity:.6;font-family:var(--mono);font-size:11px;margin-left:4px}

.timeline{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:74px 1fr auto;gap:13px;align-items:start;text-align:left;width:100%;
  background:transparent;border:0;border-top:1px solid var(--line);padding:13px 6px}
.tl-row:hover{background:var(--surface-2)}
.tl-row:first-child{border-top:0}
.tl-date{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.35;padding-top:1px}
.tl-date b{display:block;color:var(--ink);font-size:12.5px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;color:#fff;
  padding:2px 6px;border-radius:5px;vertical-align:middle}
.tl-row>span:nth-child(2){min-width:0}
.tl-l1{display:block}
.tl-title{font-weight:600;margin-left:7px}
.tl-l2{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.pill.mute{background:var(--line);color:var(--muted)}

.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}

#scrim{position:fixed;inset:0;background:rgba(12,16,14,.44);z-index:55}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(490px,95vw);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:60;overflow-y:auto;padding:0}
.dw-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;gap:10px;align-items:flex-start}
.dw-head h2{font-size:18px;flex:1}
.dw-body{padding:16px 18px 40px}
.dw-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:14px}
.frow{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.frow:first-child{border-top:0}
.frow .fk{color:var(--faint);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding-top:2px}
.frow .fv{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.res-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.res-table th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 6px;border-bottom:1px solid var(--line)}
.res-table td{padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.res-table .fl{font-weight:700}
.fl-high,.fl-low{color:var(--warn)} .fl-critical{color:var(--crit)} .fl-normal{color:var(--muted)}
.att{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.att-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px}
.att-item .ai-ic{flex:none;width:30px;height:30px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted)}
.att-item .ai-b{flex:1;min-width:0}
.att-item .ai-n{font-weight:600;word-break:break-word}
.att-item .ai-l{color:var(--muted);font-size:11.5px;display:block}
.att-item .ai-x{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.att-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.refform{border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:9px;display:flex;flex-direction:column;gap:8px}

#modalRoot{position:fixed;inset:0;z-index:80;background:rgba(12,16,14,.5);display:grid;place-items:start center;padding:28px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(660px,100%);overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-head h2{font-size:18px;flex:1}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2);flex-wrap:wrap}
.modal-foot .foot-left{margin-right:auto}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.typegrid button{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.typegrid button:hover{border-color:var(--primary);background:var(--surface-2)}
.typegrid .tt{font-weight:700;font-size:13.5px}
.typegrid .td{font-size:11.5px;color:var(--muted)}
.typegrid .tg-tag{align-self:flex-start;margin-bottom:4px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{resize:vertical;min-height:64px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:var(--surface);outline:none}
.fld.cb{flex-direction:row;align-items:center;gap:8px}
.fld.cb input{width:auto} .fld.cb span{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink)}
.fld.invalid input,.fld.invalid select{border-color:var(--crit)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-row{border:1px solid var(--line);border-radius:9px;padding:10px;position:relative;background:var(--surface-2)}
.grp-row .grp-del{position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--faint);font-size:16px;line-height:1;padding:2px 6px}
.grp-row .grp-del:hover{color:var(--crit)}
.grp-add{align-self:flex-start;border:1px dashed var(--line-strong);background:transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.grp-add:hover{border-color:var(--primary);color:var(--primary-ink)}

.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mre{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.mrx{display:flex;gap:6px;flex:none}
.arow{display:grid;grid-template-columns:150px 150px 1fr;gap:10px;padding:7px 2px;border-top:1px solid var(--line);font-size:12.5px}
.arow:first-child{border-top:0}
.arow .aat{color:var(--faint);font-family:var(--mono);font-size:11px}
.arow .aac{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:620px){.arow{grid-template-columns:1fr;gap:1px}.arow .aac{white-space:normal}}

.imgview{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:24px}
.imgview img{max-width:100%;max-height:100%;border-radius:8px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;max-width:min(460px,92vw);box-shadow:var(--shadow);text-align:center}
.idle-warn{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:130;background:var(--warn);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:min(480px,92vw)}
.idle-warn .btn{background:#fff;border-color:#fff;color:var(--warn)}
.idle-warn .btn:hover{background:#fff;color:var(--ink)}
.loading{padding:60px;text-align:center;color:var(--muted)}

body.gated .topbar,body.gated .shell{display:none}
.gate{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{max-width:432px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.gate-card .brand{margin-bottom:18px}
.gate-card h1{font-size:21px;margin-bottom:6px}
.gate-card p.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.gate-card .btn.primary{width:100%;justify-content:center;padding:10px;margin-top:2px}
.gate-card .err{background:color-mix(in srgb,var(--crit) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--crit) 40%,transparent);color:var(--crit);font-size:12.5px;padding:9px 11px;border-radius:8px;margin-bottom:14px}
.gate-card .ok{background:var(--primary-soft);color:var(--primary-ink);font-size:13px;padding:11px 13px;border-radius:9px;margin-bottom:14px}
.gate-card .lnk{background:none;border:0;color:var(--primary-ink);font-size:12.5px;font-weight:600;padding:8px 0 0;text-decoration:underline}
.gate-card .fineprint{font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.5}

@media (max-width:720px){.whoami{display:none}}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.frow{grid-template-columns:1fr}.frow .fk{padding-top:0}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center;gap:8px;padding:10px 12px}
  .rail h2,.rail-foot{display:none}
  .person-btn{width:auto;flex:none}
  .person-btn .pr{display:none}
  .rail .btn{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#printRoot{position:fixed;left:-99999px;top:0;width:190mm;background:#fff}
@media print{
  html,body{background:#fff!important}
  .topbar,.shell,#gate,#scrim,#drawer,#modalRoot,#toast,.imgview{display:none!important}
  #printRoot{position:static;left:auto;top:auto;width:auto;display:block!important;color:#111;font:12px/1.5 "Public Sans",system-ui,sans-serif}
  #printRoot h1{font-family:"Spectral",Georgia,serif;font-size:19px;margin:0 0 3px}

function getConfig(){
  let u=SUPABASE_URL,k=SUPABASE_ANON_KEY;
  try{u=localStorage.getItem("fhl_sb_url")||u;k=localStorage.getItem("fhl_sb_key")||k;}catch(e){}
  u=(u||"").trim();k=(k||"").trim();
  if(/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u)&&k.length>20)return {url:u.replace(/\/$/,""),key:k};
  return null;
}
async function init(){
  const cfg=getConfig();
  if(!cfg){renderGate("setup");return;}
  if(!self.supabase||!self.supabase.createClient){renderGate("setup","Could not load the Supabase library. Check your connection and reload.");return;}
  try{
    sb=self.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }catch(e){renderGate("setup","Those values were not accepted: "+e.message);return;}
  sb.auth.onAuthStateChange((_evt,s)=>{state.session=s;setTimeout(route,0);});
  try{const {data}=await sb.auth.getSession();state.session=data.session;}catch(e){}
  route();
}
async function route(){
  if(routing)return;routing=true;
  try{
    if(!sb){renderGate("setup");return;}
    const s=state.session, uidNow=s?s.user.id:null;
    if(!uidNow){ if(shownFor!=="anon"){teardown();shownFor="anon";} renderGate("login"); return; }
    if(shownFor===uidNow)return;
    renderGate("loading");
    const email=(s.user.email||"").toLowerCase();
    let mrow=null,merr=null;
    try{
      const r=await sb.from("members").select("email,role").eq("email",email).maybeSingle();
      mrow=r.data;merr=r.error;
    }catch(e){merr=e;}
    if(merr){shownFor=uidNow;renderGate("noaccess","Could not check access: "+(merr.message||merr)+" — is the database set up?");return;}
    if(!mrow){shownFor=uidNow;renderGate("noaccess");return;}
    state.me={email:mrow.email,role:mrow.role};
    shownFor=uidNow;
    document.body.classList.remove("gated");$("#gate").hidden=true;
    logSignin();
    startApp();
  }finally{routing=false;}
}
function teardown(){
  shownFor=null;state.me=null;state.people=[];state.events=[];state.currentId=null;state.loaded=false;
  channels.forEach(c=>{try{sb.removeChannel(c);}catch(e){}});channels=[];
  stopIdle();closeDrawer();closeModal();
}

}

  if(signinLogged)return;signinLogged=true;
  const plat=(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||"";
  try{await sb.rpc("log_event",{p_action:"signin",p_summary:(plat+" · "+(navigator.language||"")).trim()});}catch(e){}

/* ============================ idle timeout ============================ */
let idleTick=null, idleWarnEl=null;
function throttle(fn,ms){let last=0;return function(){const n=Date.now();if(n-last>=ms){last=n;fn.apply(this,arguments);}};}
function lastActiveTs(){let v=0;try{v=+localStorage.getItem("fhl_last_active")||0;}catch(e){}return v||Date.now();}
function idleTouch(){try{localStorage.setItem("fhl_last_active",String(Date.now()));}catch(e){}if(idleWarnEl){idleWarnEl.remove();idleWarnEl=null;}}
const idleThrottled=throttle(idleTouch,1000);
function idleCheck(){
  if(!state.me)return;
  const idleMs=Date.now()-lastActiveTs(), total=IDLE_MIN*60000;
  if(idleMs>=total){
    if(state.idleTimedOut)return;
    if(idleWarnEl){idleWarnEl.remove();idleWarnEl=null;}
    state.idleTimedOut=true;
    signOut("inactivity timeout");
    return;
  }
  if(idleMs>=total-IDLE_WARN_SEC*1000){
    if(!idleWarnEl){idleWarnEl=document.createElement("div");idleWarnEl.className="idle-warn";document.body.appendChild(idleWarnEl);}
    idleWarnEl.innerHTML="Signing you out in "+Math.max(1,Math.ceil((total-idleMs)/1000))+"s — no activity. "+
      '<button class="btn sm" data-act="stay">Stay signed in</button>';
  }else if(idleWarnEl){idleWarnEl.remove();idleWarnEl=null;}
}
const IDLE_EVENTS=["mousemove","mousedown","keydown","touchstart","scroll","click"];
function startIdle(){
  stopIdle();
  IDLE_EVENTS.forEach(ev=>window.addEventListener(ev,idleThrottled,{passive:true}));
  idleTouch();
  idleTick=setInterval(idleCheck,2000);
}
function stopIdle(){
  clearInterval(idleTick);idleTick=null;
  IDLE_EVENTS.forEach(ev=>window.removeEventListener(ev,idleThrottled));
  if(idleWarnEl){idleWarnEl.remove();idleWarnEl=null;}
}
window.addEventListener("storage",e=>{if(e.key==="fhl_last_active"&&idleWarnEl){idleWarnEl.remove();idleWarnEl=null;}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.me)idleCheck();});

/* ============================ data layer ============================ */
function mapPerson(r){
  return {id:r.id,name:r.name||"",relation:r.relation||"",dob:r.dob||"",sex:r.sex||"",bloodType:r.blood_type||"",
    allergies:r.allergies||[],conditions:r.conditions||[],careTeam:r.care_team||[],notes:r.notes||"",createdAt:r.created_at};
}
function mapEvent(r){
  const m=Object.assign({},r.data||{});
  m.id=r.id;m.type=r.type;m.date=r.date;m.person_id=r.person_id;
  m.attachments=r.attachments||[];m.createdAt=r.created_at;m.updatedAt=r.updated_at;
  return m;
}
async function loadPeople(){
  if(!sb)return;
  const {data,error}=await sb.from("people").select("*").order("created_at",{ascending:true});
  if(error){toast("Could not load family: "+error.message);state.loaded=true;renderAll();return;}
  state.people=(data||[]).map(mapPerson);
  if(!state.currentId||!state.people.some(p=>p.id===state.currentId))
    state.currentId=state.people[0]?state.people[0].id:null;
  state.loaded=true;
  if(state.currentId)await loadEvents(state.currentId);
  else{state.events=[];renderAll();}
}
async function loadEvents(pid){
  if(!sb||!pid){state.events=[];renderAll();return;}
  const req=++state.eventsReq;
  const {data,error}=await sb.from("events").select("*").eq("person_id",pid).order("date",{ascending:false});
  if(req!==state.eventsReq)return;
  if(error){toast("Could not load records: "+error.message);return;}
  state.events=(data||[]).map(mapEvent);
  renderAll();
}

/* ============================ derived ============================ */
function eventTitle(e){
  switch(e.type){
    case "appointment":return e.purpose||"Appointment";
    case "consultation":return e.reason||e.specialty||"Consultation";
    case "lab":return e.panel||"Laboratory";
    case "prescription":return (e.drug||"Medication")+(e.strength?" "+e.strength:"");
    case "emergency":return e.chiefComplaint||"Emergency visit";
    case "confinement":return e.reason||e.dischargeDiagnosis||"Hospital admission";
    case "vitals":return vitalsTitle(e);
    case "immunization":return e.vaccine||"Immunization";
    case "note":return e.title||"Note";
  }
  return "Record";
}
function vitalsTitle(e){
  const b=[];
  if(e.glucose)b.push("Glucose "+e.glucose+(e.glucoseContext?" ("+e.glucoseContext+")":""));
  if(e.bpSys&&e.bpDia)b.push("BP "+e.bpSys+"/"+e.bpDia);
  if(e.pulse)b.push("HR "+e.pulse);
  if(e.weightKg)b.push(e.weightKg+" kg");
  if(e.tempC)b.push(e.tempC+" °C");
  return b.join(" · ")||"Vitals recorded";
}
function eventLine2(e){
  let p=[];
  if(e.type==="appointment")p=[e.withWhom,e.facility];
  else if(e.type==="consultation")p=[e.specialty||e.doctor,e.facility,trunc(e.assessment||e.findings||"",70)];
  else if(e.type==="lab"){const r=(e.results||[]).slice(0,2).map(x=>x.analyte+" "+x.value+(x.unit?" "+x.unit:"")+(x.flag&&x.flag!=="normal"?" ("+x.flag+")":""));p=[e.facility].concat(r);}
  else if(e.type==="prescription")p=[[e.dose,e.frequency].filter(Boolean).join(" "),e.regimenTag||e.purpose,e.ongoing?"":"(ended)"];
  else if(e.type==="emergency")p=[e.facility,e.disposition];
  else if(e.type==="confinement")p=[e.facility,(e.admitDate&&e.dischargeDate)?(fmtDate(e.admitDate)+" – "+fmtDate(e.dischargeDate)):(e.admitDate?"admitted "+fmtDate(e.admitDate):null),trunc(e.dischargeDiagnosis||e.reason||e.summary||"",70)];
  else if(e.type==="vitals")p=[e.notes];
  else if(e.type==="immunization")p=[e.facility,e.doseNumber,e.nextDueDate?"next due "+fmtDate(e.nextDueDate):null];
  else if(e.type==="note")p=[trunc(e.body||"",96)];
  return p.filter(Boolean).join(" · ");
}
function statusPill(e){
  if(e.type==="appointment"&&e.status){
    const m={scheduled:"info",completed:"ok",missed:"crit",cancelled:"mute",rescheduled:"warn"};
    return {cls:m[e.status]||"mute",text:e.status};
  }
  if(e.type==="emergency"&&e.disposition){
    const m={discharged:"mute",admitted:"warn","under observation":"warn",transferred:"warn","left against advice":"crit"};
    return {cls:m[e.disposition]||"mute",text:e.disposition};
  }
  if(e.type==="prescription"&&e.ongoing)return {cls:"ok",text:"ongoing"};
  if(e.type==="confinement"){
    if(e.admitDate&&e.dischargeDate){
      const n=Math.max(0,Math.round((new Date(e.dischargeDate)-new Date(e.admitDate))/86400000));
      return {cls:"mute",text:n+(n===1?" night":" nights")};
    }
    if(e.admitDate)return {cls:"warn",text:"admitted"};
  }
  return null;
}
function sortKey(e){return e.datetime||e.date||"";}
function upcomingAppts(){
  const now=nowMinISO();
  return state.events.filter(e=>e.type==="appointment"&&(e.datetime||"")>=now&&(e.status==="scheduled"||e.status==="rescheduled"))
    .sort((a,b)=>(a.datetime||"").localeCompare(b.datetime||""));
}
function attentionItems(){
  const now=nowMinISO(),t=todayISO(),out=[];
  state.events.forEach(e=>{
    if(e.type==="appointment"&&(e.status==="scheduled"||e.status==="rescheduled")&&(e.datetime||"")<now)
      out.push({t:"Past appointment still marked “"+e.status+"”",d:eventTitle(e)+" · "+fmtDateTime(e.datetime),id:e.id});
    if(e.type==="immunization"&&e.nextDueDate&&e.nextDueDate<t)
      out.push({t:"Immunization due",d:(e.vaccine||"")+" · due "+fmtDate(e.nextDueDate),id:e.id});
    if(e.type==="consultation"&&e.followUpDate&&e.followUpDate<t)
      out.push({t:"Follow-up date passed",d:"from the "+fmtDate(e.date)+" consultation",id:e.id});
    if(e.type==="confinement"&&e.admitDate&&!e.dischargeDate&&e.admitDate<t)
      out.push({t:"Hospital stay not closed out",d:(e.reason||"Admission")+" · admitted "+fmtDate(e.admitDate),id:e.id});
  });
  return out;
}
function latestA1c(){
  let best=null;
  state.events.forEach(e=>{
    if(e.type!=="lab")return;
    (e.results||[]).forEach(r=>{
      if(/a1c|hba1c/i.test(r.analyte||"")){
        const v=parseFloat(r.value);if(isNaN(v))return;
        if(!best||e.date>best.date)best={date:e.date,v:r.value,flag:r.flag};
      }
    });
  });
  return best;
}
function glucoseSeries(){
  return state.events.filter(e=>e.type==="vitals"&&e.glucose&&!isNaN(parseFloat(e.glucose)))
    .map(e=>({d:e.date,v:parseFloat(e.glucose),ctx:e.glucoseContext}))
    .sort((a,b)=>(a.d||"").localeCompare(b.d||"")).slice(-12);
}
function activeMeds(){
  const t=todayISO();
  return state.events.filter(e=>e.type==="prescription"&&(e.ongoing===true||(e.endDate&&e.endDate>=t)));
}
function sparkline(vals,color){
  if(vals.length<2)return "";
  const w=168,h=40,pad=4,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1),h-pad-((v-mn)/rng)*(h-2*pad)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="color:'+color+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.7" fill="currentColor"/></svg>';
}
function flagColor(f){return f==="critical"?"var(--crit)":(f==="high"||f==="low")?"var(--warn)":"var(--ok)";}

/* ============================ forms ============================ */
function fieldHtml(f,val){
  const req=f.req?' <span style="color:var(--crit)">*</span>':"";
  const name='name="'+f.k+'"';
  let inner;
  if(f.t==="textarea")inner='<textarea '+name+' placeholder="'+esc(f.ph||"")+'">'+esc(val||"")+'</textarea>';
  else if(f.t==="select")inner='<select '+name+'>'+f.opts.map(o=>'<option value="'+esc(o)+'"'+((val||f.def||"")===o?" selected":"")+'>'+esc(o||"—")+'</option>').join("")+'</select>';
  else if(f.t==="checkbox")return '<label class="fld cb"><input type="checkbox" '+name+(val?" checked":"")+'><span>'+esc(f.l)+'</span></label>';
  else inner='<input type="'+f.t+'" '+name+' value="'+esc(val==null?"":val)+'" placeholder="'+esc(f.ph||"")+'">';
  return '<label class="fld'+(f.half?" half":"")+'" data-fk="'+f.k+'"><span>'+esc(f.l)+req+'</span>'+inner+'</label>';
}
function groupRowHtml(f,item){
  item=item||{};
  return '<div class="grp-row"><button type="button" class="grp-del" data-act="grp-del" aria-label="Remove">✕</button>'+
    '<div class="grid2">'+f.fields.map(sf=>fieldHtml(sf,item[sf.k])).join("")+'</div></div>';
}
function schemaFormHtml(schema,data){
  data=data||{};
  const out=[];let buf=[];
  const flush=()=>{if(buf.length){out.push('<div class="grid2">'+buf.join("")+'</div>');buf=[];}};
  schema.forEach(f=>{
    if(f.t==="group"){
      flush();
      const items=(data[f.k]&&data[f.k].length)?data[f.k]:[];
      out.push('<div class="fld"><span>'+esc(f.l)+'</span><div class="grp" data-group="'+f.k+'">'+
        items.map(it=>groupRowHtml(f,it)).join("")+'</div>'+
        '<button type="button" class="grp-add" data-act="grp-add" data-group="'+f.k+'">＋ Add '+esc(f.singular||"row")+'</button></div>');
    }else if(f.half){buf.push(fieldHtml(f,data[f.k]));}
    else{flush();out.push(fieldHtml(f,data[f.k]));}
  });
  flush();
  return out.join("");
}
function readSchemaForm(root,schema){
  const out={};
  schema.forEach(f=>{
    if(f.t==="group"){
      out[f.k]=[];
      const box=root.querySelector('[data-group="'+f.k+'"]');
      if(box)$$(".grp-row",box).forEach(row=>{
        const it={};let any=false;
        f.fields.forEach(sf=>{const el=row.querySelector('[name="'+sf.k+'"]');const v=el?el.value.trim():"";it[sf.k]=v;if(v)any=true;});
        if(any)out[f.k].push(it);
      });
    }else if(f.t==="checkbox"){const el=root.querySelector('[name="'+f.k+'"]');out[f.k]=!!(el&&el.checked);}
    else{const el=root.querySelector('[name="'+f.k+'"]');out[f.k]=el?el.value.trim():"";}
  });
  return out;
}
function validate(root,schema){
  let ok=true;
  schema.forEach(f=>{
    if(!f.req)return;
    const el=root.querySelector('[name="'+f.k+'"]');
    const wrap=el&&el.closest(".fld");
    if(el&&!el.value.trim()){ok=false;if(wrap)wrap.classList.add("invalid");}
    else if(wrap)wrap.classList.remove("invalid");
  });
  return ok;
}

/* ============================ attachments ============================ */
const MAX_FILE=25*1024*1024;
async function attachFile(file){
  if(!isEditor()){toast("Your account is view-only.");return;}
  const eid=state.openEventId,pid=state.currentId;
  if(!eid||!pid)return;
  if(file.size>MAX_FILE){toast('“'+file.name+'” is '+fileSize(file.size)+'. The limit is 25 MB — add it as a reference instead.');return;}
  toast("Uploading "+file.name+"…");
  const attId=uid();
  const safe=file.name.replace(/[^\w.\-]+/g,"_").slice(-80)||"file";
  const path=pid+"/"+eid+"/"+attId+"__"+safe;
  try{
    const up=await sb.storage.from("attachments").upload(path,file,{upsert:true,contentType:file.type||undefined});
    if(up.error)throw up.error;
    const kind=/^image\//.test(file.type)?"image":(file.type==="application/pdf"?"pdf":"file");
    const ev=state.events.find(e=>e.id===eid);
    const atts=(ev.attachments||[]).concat([{id:attId,name:file.name,kind:kind,size:file.size,path:path,hasFile:true}]);
    const upd=await sb.from("events").update({attachments:atts,updated_at:nowISO()}).eq("id",eid);
    if(upd.error)throw upd.error;
    await loadEvents(pid);toast("File attached.");
  }catch(err){toast("Upload failed: "+(err.message||err));}
}
async function addReference(name,loc){
  if(!isEditor()){toast("Your account is view-only.");return;}
  const eid=state.openEventId;if(!eid)return;
  if(!name.trim()){toast("Give the reference a name.");return;}
  try{
    const ev=state.events.find(e=>e.id===eid);
    const atts=(ev.attachments||[]).concat([{id:uid(),name:name.trim(),kind:"reference",refLocation:loc.trim(),hasFile:false}]);
    const {error}=await sb.from("events").update({attachments:atts,updated_at:nowISO()}).eq("id",eid);
    if(error)throw error;
    await loadEvents(state.currentId);toast("Reference added.");
  }catch(err){toast("Could not add: "+(err.message||err));}
}
async function removeAttachment(attId){
  if(!isEditor()){toast("Your account is view-only.");return;}
  const eid=state.openEventId;if(!eid)return;
  try{
    const ev=state.events.find(e=>e.id===eid);
    const a=(ev.attachments||[]).find(x=>x.id===attId);
    if(a&&a.path){try{await sb.storage.from("attachments").remove([a.path]);}catch(e){}}
    const {error}=await sb.from("events").update({attachments:(ev.attachments||[]).filter(x=>x.id!==attId),updated_at:nowISO()}).eq("id",eid);
    if(error)throw error;
    await loadEvents(state.currentId);toast("Attachment removed.");
  }catch(err){toast("Could not remove: "+(err.message||err));}
}
async function signedUrl(path){
  const {data,error}=await sb.storage.from("attachments").createSignedUrl(path,3600);
  if(error)throw error;return data.signedUrl;
}
async function viewAttachment(attId){
  const ev=state.events.find(e=>e.id===state.openEventId);const a=(ev&&ev.attachments||[]).find(x=>x.id===attId);
  if(!a||!a.path)return;
  // open the tab synchronously (within the click) so pop-up blockers allow it
  const win=a.kind==="image"?null:window.open("","_blank");
  try{
    const url=await signedUrl(a.path);
    if(a.kind==="image"){
      const v=document.createElement("div");v.className="imgview";v.innerHTML='<img alt="attachment" src="'+esc(url)+'">';
      v.addEventListener("click",()=>v.remove());document.body.appendChild(v);
    }else if(win){win.location=url;}
    else window.open(url,"_blank","noopener");
  }catch(err){if(win)win.close();toast("Could not open: "+(err.message||err));}
}
async function saveAttachment(attId){
  const ev=state.events.find(e=>e.id===state.openEventId);const a=(ev&&ev.attachments||[]).find(x=>x.id===attId);
  if(!a||!a.path)return;
  try{
    const url=await signedUrl(a.path);
    const r=await fetch(url);const b=await r.blob();
    downloadBlob(a.name||"attachment",b);
  }catch(err){toast("Could not download: "+(err.message||err));}
}
function downloadBlob(name,blob){
  const u=URL.createObjectURL(blob);const el=document.createElement("a");
  el.href=u;el.download=name;document.body.appendChild(el);el.click();el.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function download(name,text,mime){downloadBlob(name,new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"}));}

      note:"Attachment files live in Supabase Storage; this backup lists their storage paths, not their contents.",
      people:(pr.data||[]).map(p=>Object.assign({},p,{events:byP[p.id]||[]}))};
    download("santos-family-health-"+todayISO()+".json",JSON.stringify(dump,null,2),"application/json");
  }catch(err){toast("Backup failed: "+(err.message||err));}
}

  state.events.slice().sort((a,b)=>sortKey(b).localeCompare(sortKey(a))).forEach(e=>{
    rows.push([sortKey(e).slice(0,16),(TYPES[e.type]||{label:e.type}).label,eventTitle(e),e.facility||e.withWhom||"",
      e.doctor||e.prescriber||e.withWhom||e.attendingDoctor||"",
      e.status||e.disposition||(e.ongoing?"ongoing":"")||(e.type==="confinement"?(e.dischargeDate?"discharged":e.admitDate?"admitted":""):""),
      eventLine2(e)+(e.impression?" — "+e.impression:"")+(e.plan?" — Plan: "+e.plan:"")+(e.summary?" — Summary: "+e.summary:"")+(e.dischargeDiagnosis?" — Dx: "+e.dischargeDiagnosis:"")+((e.attachments||[]).length?" — "+e.attachments.length+" attachment(s)":"")]);
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  download((p.name||"person").replace(/[^\w]+/g,"-").toLowerCase()+"-records-"+todayISO()+".csv",csv,"text/csv");
}

/* ============================ print / PDF ============================ */
function pkv(label,val){return val?'<div class="pr-kv"><span class="pk">'+esc(label)+'</span><span class="pv">'+esc(val)+'</span></div>':"";}
function recordBlock(e){
  const T=TYPES[e.type]||{label:e.type},sc=SCHEMAS[e.type]||[];
  let b='<div class="pr-rec"><div class="pr-rt">'+esc(fmtDate(sortKey(e)))+' · '+esc(T.label)+'</div>'+
    '<div class="pr-rh">'+esc(eventTitle(e))+'</div>';
  sc.forEach(f=>{
    if(f.t==="group"||f.k==="results")return;
    if(f.t==="checkbox"){if(e[f.k])b+=pkv(f.l,"Yes");return;}
    const v=e[f.k];if(v==null||v==="")return;
    b+=pkv(f.l,f.t==="datetime-local"?fmtDateTime(v):(f.t==="date"?fmtDate(v):v));
  });
  if(e.type==="lab"&&(e.results||[]).length){
    b+='<table class="pr-res"><tr><th>Test</th><th>Result</th><th>Reference</th><th>Flag</th></tr>'+
      e.results.map(r=>'<tr><td>'+esc(r.analyte||"")+'</td><td>'+esc((r.value||"")+(r.unit?" "+r.unit:""))+'</td><td>'+esc(r.ref||"")+'</td><td>'+esc(r.flag||"")+'</td></tr>').join("")+'</table>';
  }
  const atts=e.attachments||[];
  if(atts.length)b+=pkv("Attachments",atts.map(a=>(a.name||"file")+(a.refLocation?" — kept at "+a.refLocation:"")).join("; "));
  return b+'</div>';
}
function imgAppendix(list){
  if(!list.length)return "";
  return '<div class="pr-appendix">'+list.map(x=>'<div><div class="pr-rt">'+esc(x.caption)+'</div><img src="'+esc(x.url)+'" alt=""></div>').join("")+'</div>';
}
async function collectImageUrls(evs){
  const out={},jobs=[];
  evs.forEach(e=>(e.attachments||[]).forEach(a=>{
    if(a.hasFile&&a.kind==="image"&&a.path)jobs.push(signedUrl(a.path).then(u=>{out[a.id]=u;}).catch(()=>{}));
  }));
  await Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,8000))]);
  return out;
}
function doPrint(inner,title){
  const r=$("#printRoot");r.innerHTML=inner;
  const oldTitle=document.title;if(title)document.title=title;
  let cleared=false;
  const done=()=>{if(cleared)return;cleared=true;r.innerHTML="";document.title=oldTitle;window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  const imgs=Array.from(r.querySelectorAll("img"));
  const go=()=>{window.print();setTimeout(done,60000);};
  if(!imgs.length){go();return;}
  Promise.race([
    Promise.all(imgs.map(im=>im.complete?0:new Promise(res=>{im.onload=im.onerror=res;}))),
    new Promise(res=>setTimeout(res,6000))
  ]).then(go);
}
async function printPerson(){
  const p=currentPerson();if(!p)return;
  toast("Building document…");
  const evs=state.events.slice().sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
  const imgs=await collectImageUrls(evs);
  const age=ageStr(p.dob);
  let s='<h1>'+esc(p.name)+' — Medical record</h1>'+
    '<div class="pr-meta">'+esc([p.relation,age,p.sex,p.bloodType?"Blood type "+p.bloodType:""].filter(Boolean).join("   ·   "))+
    '<br>Generated '+esc(fmtDate(todayISO()))+' · Santos Family Health · '+evs.length+' record'+(evs.length===1?"":"s")+'</div>';
  s+='<h2>Profile</h2>';
  s+=pkv("Date of birth",p.dob?fmtDate(p.dob):"");
  if((p.allergies||[]).some(a=>a.name))s+=pkv("Allergies",(p.allergies||[]).filter(a=>a.name).map(a=>a.name+(a.reaction?" ("+a.reaction+")":"")).join("; "));
  if((p.conditions||[]).some(c=>c.name))s+=pkv("Conditions",(p.conditions||[]).filter(c=>c.name).map(c=>c.name+(c.status?" — "+c.status:"")).join("; "));
  if((p.careTeam||[]).some(d=>d.name))s+=pkv("Care team",(p.careTeam||[]).filter(d=>d.name).map(d=>d.name+(d.role?" ("+d.role+")":"")+(d.contact?", "+d.contact:"")).join("; "));
  if(p.notes)s+=pkv("Notes",p.notes);
  const am=activeMeds();
  if(am.length){
    s+='<h2>Active medications</h2>';
    am.forEach(m=>{s+=pkv((m.drug||"")+(m.strength?" "+m.strength:""),[m.dose,m.frequency,m.route].filter(Boolean).join(" · ")+(m.purpose?" — "+m.purpose:""));});
  }
  s+='<h2>Records</h2>';
  evs.forEach(e=>{s+=recordBlock(e);});
  const app=[];
  evs.forEach(e=>(e.attachments||[]).forEach(a=>{if(a.kind==="image"&&imgs[a.id])app.push({url:imgs[a.id],caption:fmtDate(sortKey(e))+" · "+eventTitle(e)+" · "+(a.name||"")});}));
  if(app.length)s+='<h2>Attached images</h2>'+imgAppendix(app);
  doPrint(s,(p.name||"record").replace(/[^\w ]+/g,"").trim()+" — medical record — "+todayISO());
}
async function printRecord(id){
  const e=state.events.find(x=>x.id===id);if(!e)return;
  const p=currentPerson();
  toast("Building document…");
  const imgs=await collectImageUrls([e]);
  const T=TYPES[e.type]||{label:e.type};
  let s='<h1>'+esc(p?p.name:"")+'</h1><div class="pr-meta">'+esc(T.label)+' · '+esc(fmtDate(sortKey(e)))+
    '   —   Generated '+esc(fmtDate(todayISO()))+' · Santos Family Health</div>'+recordBlock(e);
  const list=(e.attachments||[]).filter(a=>a.kind==="image"&&imgs[a.id]).map(a=>({url:imgs[a.id],caption:a.name||""}));
  if(list.length)s+='<h2>Attached images</h2>'+imgAppendix(list);
  doPrint(s,((p&&p.name)||"record").replace(/[^\w ]+/g,"").trim()+" — "+T.label+" "+fmtDate(sortKey(e)));
}

/* ============================ events ============================ */
const fileInput=document.createElement("input");
fileInput.type="file";fileInput.accept="image/*,.heic,.heif,application/pdf,.doc,.docx,.txt";fileInput.style.display="none";
document.body.appendChild(fileInput);
fileInput.addEventListener("change",()=>{const f=fileInput.files[0];if(f)attachFile(f);fileInput.value="";});

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  switch(act){
    case "theme":toggleTheme();break;

    /* gate */
    case "cfg-save":{
      const u=($("#cfgUrl").value||"").trim().replace(/\/$/,"");
      const k=($("#cfgKey").value||"").trim();
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)){renderGate("setup","That doesn’t look like a Supabase URL (https://xxxx.supabase.co).");break;}
      if(k.length<20){renderGate("setup","The anon key looks too short.");break;}
      try{localStorage.setItem("fhl_sb_url",u);localStorage.setItem("fhl_sb_key",k);}catch(e){}
      location.reload();break;
    }
    case "send-link":sendLink();break;
    case "login-restart":renderGate("login");break;
    case "route-retry":shownFor=null;state.gateMsg="";route();break;
    case "signout":signOut();break;
    case "stay":idleTouch();break;

    /* app */
    case "members":membersModal();break;
    case "activity":activityModal();break;
    case "mem-add":memberAdd();break;
    case "mem-role":memberRole(id,t.dataset.role);break;
    case "mem-del":memberDel(id);break;
    case "person":if(id!==state.currentId){state.currentId=id;state.filter="all";closeDrawer();loadEvents(id);renderAll();}break;
    case "add-person":personModal(null);break;
    case "edit-person":personModal(currentPerson());break;
    case "save-person":savePerson(id||null);break;
    case "del-person":deletePerson(state.editPersonId);break;
    case "add-record":typePickerModal();break;
    case "pick-type":recordModal(id,null);break;
    case "save-record":saveRecord(t.dataset.type,id||null);break;
    case "open-event":openDrawer(id);break;
    case "close-drawer":closeDrawer();break;
    case "close-modal":closeModal();break;
    case "edit-record":{const e=state.events.find(x=>x.id===state.openEventId);if(e)recordModal(e.type,e);break;}
    case "del-record":deleteRecord(state.openEventId);break;
    case "filter":state.filter=id;renderMain();break;
    case "export-json":exportJSON();break;
    case "export-csv":exportCSV();break;
    case "print-person":printPerson();break;
    case "print-record":printRecord(state.openEventId);break;
    case "att-file":fileInput.click();break;
    case "att-ref":{
      const slot=$("#refFormSlot");
      if(slot.innerHTML){slot.innerHTML="";break;}
      slot.innerHTML='<div class="refform"><label class="fld"><span>What is it</span><input id="refName" placeholder="e.g. Official lab result (PDF), X-ray plate"></label>'+
        '<label class="fld"><span>Where the original is kept</span><input id="refLoc" placeholder="e.g. blue folder / hospital portal"></label>'+
        '<div style="display:flex;gap:8px"><button class="btn sm primary" data-act="att-ref-save">Add reference</button>'+
        '<button class="btn sm" data-act="att-ref-cancel">Cancel</button></div></div>';
      break;
    }
    case "att-ref-save":addReference($("#refName").value||"",$("#refLoc").value||"");break;
    case "att-ref-cancel":$("#refFormSlot").innerHTML="";break;
    case "att-view":viewAttachment(id);break;
    case "att-save":saveAttachment(id);break;
    case "att-del":removeAttachment(id);break;
    case "grp-add":{
      const box=t.parentElement.querySelector('[data-group="'+t.dataset.group+'"]');
      const schema=box.closest("#personForm")?PERSON_SCHEMA:SCHEMAS[$("#recForm").dataset.type];
      const f=schema.find(x=>x.k===t.dataset.group);
      box.insertAdjacentHTML("beforeend",groupRowHtml(f,{}));
      break;
    }
    case "grp-del":t.closest(".grp-row").remove();break;
  }
});
async function sendLink(){
  const email=(($("#loginEmail")&&$("#loginEmail").value)||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){renderGate("login","Enter a valid email address.");return;}
  state._email=email;
  try{
    const {error}=await sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error)throw error;
    renderGate("sent");
  }catch(err){renderGate("login",(err.message||String(err))+".");}
}
document.addEventListener("change",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  if(t.dataset.act==="mem-role-sel")memberRole(t.dataset.id,t.value);
});
$("#scrim").addEventListener("click",closeDrawer);
$("#modalRoot").addEventListener("click",e=>{if(e.target.id==="modalRoot")closeModal();});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&document.body.classList.contains("gated")){
    if($("#loginEmail")){sendLink();return;}
    if($("#cfgUrl")){document.querySelector('[data-act="cfg-save"]').click();return;}
  }
  if(e.key!=="Escape")return;
  const iv=$(".imgview");if(iv){iv.remove();return;}
  if(!$("#modalRoot").hidden)closeModal();
  else if(!$("#drawer").hidden)closeDrawer();
});
